workflows:
  android-apk:
    name: Baly Driver Assistant - APK
    max_build_duration: 60
    instance_type: linux
    environment:
      java: 17
    scripts:
      - name: Download Gradle and build debug APK
        script: |
          set -euo pipefail
          GRADLE_VERSION=8.10.2
          curl --fail --location --silent --show-error \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --no-daemon --stacktrace assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
